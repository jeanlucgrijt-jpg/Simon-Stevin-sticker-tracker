<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simon stevin sticker tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }
        button {
            margin-top: 20px;
            padding: 10px 15px;
        }
        .clickable {
            cursor: pointer;
            width: 200px;
        }
        .map_preview {
            width: 100px;
        }
    </style>
</head>
<body>

<h2>Submit Sticker Data</h2>

<form id="stickerform">

```
<label>Latitude</label>
<input type="number" step="0.000001" name="latitude">

<label>Longitude</label>
<input type="number" step="0.000001" name="longitude">

<label>Date Picture Taken</label>
<input type="date" name="date_picture">

<label>Sticker ID</label>
<input type="text" name="sticker_id" maxlength="15">

<label>Title</label>
<input type="text" name="title" maxlength="50">

<label>Description</label>
<textarea name="description"></textarea>

<button type="submit">Submit</button>
```

</form>

<img class="clickable" id="testsubmit" src="../pictures_site/test.png" alt="FC Utrecht best club van de wereld">

<script src="../Frontend/sticker_tracker_main.js"></script>

</body>
</html>
